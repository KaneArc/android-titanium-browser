name: Inspect Chromium source

# Fast (minutes) helper: fetches ONLY the files involved in HTTP/proxy auth
# for a Chromium tag and prints them. Run it from the Actions tab and paste the
# log back. Needs to be on the default branch to appear in the Actions tab.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Chromium tag'
        required: true
        type: string
        default: '153.0.8010.52'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch only the files we need
        run: |
          set -e
          git init src
          cd src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          git config extensions.partialClone origin
          git fetch --depth 1 --filter=blob:none origin \
            "+refs/tags/${{ inputs.version }}:refs/tags/target"
          git ls-tree -r --name-only target \
            | grep -E '(chrome_http_auth_handler|ChromeHttpAuthHandler|/login_handler|http_auth_manager|http_auth_observer|login_model)' \
            | grep -v -E '(unittest|browsertest|/test)' > ../files.txt
          echo "Files selected:"; cat ../files.txt
          xargs -a ../files.txt git checkout target --

      - name: Print the code
        working-directory: src
        run: |
          echo "##### A. login_handler.h"
          cat chrome/browser/ui/login/login_handler.h

          echo; echo "##### B. login_handler.cc: context around is_proxy"
          grep -n -B12 -A16 "is_proxy" chrome/browser/ui/login/login_handler.cc

          echo; echo "##### C. chrome_http_auth_handler.h"
          cat chrome/browser/ui/android/chrome_http_auth_handler.h

          echo; echo "##### D. chrome_http_auth_handler.cc"
          cat chrome/browser/ui/android/chrome_http_auth_handler.cc

          echo; echo "##### E. Java ChromeHttpAuthHandler"
          J=$(grep 'ChromeHttpAuthHandler.java' ../files.txt | head -1)
          echo "path: $J"
          cat "$J"

          echo; echo "##### F. http auth observer/manager headers"
          for f in $(grep -E 'http_auth_(observer|manager)\.h$' ../files.txt); do
            echo "--- $f"; cat "$f"
          done
