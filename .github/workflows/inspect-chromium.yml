name: Inspect Chromium source

# Fast (minutes) helper: fetches ONLY the files involved in HTTP/proxy auth
# for a Chromium tag and prints them, one step per file group.
# Must be on the default branch to show up in the Actions tab.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Chromium tag'
        required: true
        type: string
        default: '153.0.8010.52'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch only the files we need
        run: |
          set -e
          git init src
          cd src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          git config extensions.partialClone origin
          git fetch --depth 1 --filter=blob:none origin \
            "+refs/tags/${{ inputs.version }}:refs/tags/target"
          git ls-tree -r --name-only target \
            | grep -E '(chrome_http_auth_handler|ChromeHttpAuthHandler\.java|/LoginPrompt\.java|browser/ui/android/login_handler_android|browser/ui/login/login_handler\.(cc|h))' \
            | grep -v -E '(unittest|browsertest|javatests|Test\.java)' > ../files.txt
          cat ../files.txt
          xargs -a ../files.txt git checkout target --

      - name: "1. Java ChromeHttpAuthHandler"
        working-directory: src
        run: |
          f=$(grep 'ChromeHttpAuthHandler.java' ../files.txt | head -1)
          echo "path: $f"
          [ -n "$f" ] || { echo "not found"; exit 0; }
          grep -v -E '^\s*$|^import ' "$f"

      - name: "2. Java LoginPrompt"
        working-directory: src
        run: |
          for f in $(grep '/LoginPrompt.java' ../files.txt); do
            echo "--- $f"
            grep -v -E '^\s*$|^import ' "$f"
          done
          grep -q '/LoginPrompt.java' ../files.txt || echo "LoginPrompt.java not found"

      - name: "3. C++ ChromeHttpAuthHandler (.h and .cc)"
        working-directory: src
        run: |
          for f in chrome/browser/ui/android/chrome_http_auth_handler.h \
                   chrome/browser/ui/android/chrome_http_auth_handler.cc; do
            echo "--- $f"; grep -v -E '^\s*$|^#include|^//' "$f"
          done

      - name: "4. C++ login_handler_android.cc"
        working-directory: src
        run: grep -v -E '^\s*$|^#include' chrome/browser/ui/android/login_handler_android.cc

      - name: "5. login_handler.h and is_proxy context"
        working-directory: src
        run: |
          echo "--- login_handler.h"
          grep -v -E '^\s*$|^#include|^//' chrome/browser/ui/login/login_handler.h
          echo; echo "--- login_handler.cc around is_proxy"
          grep -n -B10 -A14 "is_proxy" chrome/browser/ui/login/login_handler.cc
