name: Inspect Chromium source

# Fast (minutes) helper: fetches only the files that decide whether extensions
# (e.g. ZeroOmega) get to answer a proxy 407 before the login dialog shows.
# Must be on the default branch to show up in the Actions tab.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Chromium tag'
        required: true
        type: string
        default: '153.0.8010.52'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch only the files we need
        run: |
          set -e
          git init src
          cd src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          git config extensions.partialClone origin
          git fetch --depth 1 --filter=blob:none origin \
            "+refs/tags/${{ inputs.version }}:refs/tags/target"
          git ls-tree -r --name-only target \
            | grep -E '^(chrome/browser/ui/login/|extensions/buildflags/|extensions/browser/api/web_request/web_request_api\.(h|cc)$|chrome/browser/chrome_content_browser_client\.cc$)' \
            | grep -v -E '(unittest|browsertest)' > ../files.txt
          cat ../files.txt
          xargs -a ../files.txt git checkout target --

      - name: "1. login/BUILD.gn and buildflags.gni"
        working-directory: src
        run: |
          echo "--- chrome/browser/ui/login/BUILD.gn"
          grep -v -E '^\s*$' chrome/browser/ui/login/BUILD.gn
          echo; echo "--- extensions/buildflags"
          for f in $(grep '^extensions/buildflags/' ../files.txt); do echo "## $f"; grep -v -E '^\s*$' "$f"; done

      - name: "2. http_auth_coordinator.cc"
        working-directory: src
        run: grep -v -E '^\s*$' chrome/browser/ui/login/http_auth_coordinator.cc

      - name: "3. extension / android mentions in login_handler.cc and login_tab_helper.cc"
        working-directory: src
        run: |
          for f in chrome/browser/ui/login/login_handler.cc chrome/browser/ui/login/login_tab_helper.cc; do
            echo "--- $f"
            grep -n -B2 -A10 -E 'ENABLE_EXTENSIONS|IS_ANDROID|extensions::|MaybeProxyAuthRequest' "$f" | head -150
          done

      - name: "4. ChromeContentBrowserClient::CreateLoginDelegate"
        working-directory: src
        run: |
          grep -n -B3 -A45 'ChromeContentBrowserClient::CreateLoginDelegate(' \
            chrome/browser/chrome_content_browser_client.cc | head -120

      - name: "5. WebRequestAPI::MaybeProxyAuthRequest"
        working-directory: src
        run: |
          grep -n -B6 -A6 'MaybeProxyAuthRequest' extensions/browser/api/web_request/web_request_api.h
          echo "--- definition"
          grep -n -A40 'WebRequestAPI::MaybeProxyAuthRequest(' extensions/browser/api/web_request/web_request_api.cc | head -80
