name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest'
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Setup Build Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-chromium-titanium
          max-size: 70G
          create-symlink: true
          append-timestamp: true

      - name: Configure Cache Path
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          mkdir -p ${{ env.CCACHE_DIR }}
      
      - name: Update Submodules
        run: |
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "update"
            git push
          fi

      - name: Set ENV
        run: | 
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
    
      - name: Build
        id: compile
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          timeout 320m ./build.sh
          
          if [ $? -eq 124 ]; then
            echo "CONTINUE_BUILD=true" >> $GITHUB_ENV
            echo "Build hit checkpoint timeout. Saving cache and triggering next iteration..."
          else
            echo "CONTINUE_BUILD=false" >> $GITHUB_ENV
          fi

      - name: Chain-load Next Run
        if: env.CONTINUE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering follow-up run..."
          gh run trigger ${{ github.run_id }}
          exit 1

      - name: Process Release Artifacts
        if: env.CONTINUE_BUILD == 'false'
        run: |
          export TARGET_DIR="chromium/src/out/release"
          export VERSION=$(find $TARGET_DIR -name '*arm64-v8a.apk' | sed 's/.*\///;s/\-arm64-v8a.apk$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          mv $TARGET_DIR/$VERSION-arm64-v8a.aab ./$VERSION-${{ env.unix_time }}-arm64-v8a.aab
          mv $TARGET_DIR/$VERSION-arm64-v8a.apk ./$VERSION-${{ env.unix_time }}-arm64-v8a.apk
          mv $TARGET_DIR/$VERSION-armeabi-v7a.apk ./$VERSION-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Publish Release
        if: env.CONTINUE_BUILD == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Attest Build Provenance
        if: env.CONTINUE_BUILD == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk
