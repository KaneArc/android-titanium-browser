name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest' # Changed default to GitHub runner
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: write # Crucial: Allows the runner to re-trigger itself

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Setup Build Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-chromium-titanium
          max-size: 50G
          create-symlink: true
          append-timestamp: true # Prevents cache corruption on subsequent sequential runs

      - name: Configure Cache Path
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          mkdir -p ${{ env.CCACHE_DIR }}
      
      - name: Update 
        run: |
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "update"
            git push
          fi

      - name: Set ENV
        run: | 
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
    
      - name: Build
        id: compile
        env:
            DEBIAN_FRONTEND: noninteractive
            LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
            STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          # 320 minutes (5.3 hours) cuts the script off right before GitHub's 6-hour limit.
          # This allows the action to exit cleanly and save your compiled progress.
          timeout 320m ./build.sh
          
          # Detect if it hit the timeout checkpoint
          if [ $? -eq 124 ]; then
            echo "CONTINUE_BUILD=true" >> $GITHUB_ENV
            echo "Build hit checkpoint. Saving cache and restarting..."
          else
            echo "CONTINUE_BUILD=false" >> $GITHUB_ENV
          fi

      # This runs ONLY if the build timed out. It saves the cache and automatically starts a new run.
      - name: Chain-load Next Run
        if: env.CONTINUE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering a follow-up run to pick up where we left off..."
          gh run trigger ${{ github.run_id }}
          exit 1 # Intentionally fail this run so it stops here and the new one takes over

      - name: Set
        if: env.CONTINUE_BUILD == 'false'
        run: |
          export VERSION=$(find chromium/src/out/release -name '*arm64-v8a.apk' | sed 's/.*\///;s/\-arm64-v8a.apk$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv $(find chromium/src/out/release -name '*arm64-v8a.aab') $VERSION-${{ env.unix_time }}-arm64-v8a.aab
          mv $(find chromium/src/out/release -name '*arm64-v8a.apk') $VERSION-${{ env.unix_time }}-arm64-v8a.apk
          mv $(find chromium/src/out/release -name '*armeabi-v7a.apk') $VERSION-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Publish
        if: env.CONTINUE_BUILD == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Attest
        if: env.CONTINUE_BUILD == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk
