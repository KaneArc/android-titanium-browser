name: Inspect Chromium source

# Fast (minutes) helper: fetches ONLY a few source directories of a Chromium tag
# and prints the code that decides whether proxy credentials get saved.
# Put this file at .github/workflows/inspect-chromium.yml, then run it from
# the Actions tab and paste the log output back.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Chromium tag'
        required: true
        type: string
        default: '153.0.8010.52'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse partial fetch
        run: |
          set -e
          git init src
          cd src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set \
            chrome/browser/ui/login \
            chrome/browser/ui/android \
            chrome/browser/password_manager \
            components/password_manager/core/browser
          git fetch --depth 1 --filter=blob:none origin \
            "+refs/tags/${{ inputs.version }}:refs/tags/target"
          git checkout target
          echo "Checked out $(git rev-parse --short HEAD) for ${{ inputs.version }}"

      - name: Print proxy / credential-saving code
        working-directory: src
        run: |
          echo "##### 1. every is_proxy usage"
          grep -rn "is_proxy" chrome/browser components/password_manager \
            --include=*.cc --include=*.h --include=*.java | grep -v _unittest | grep -v _browsertest | head -60

          echo; echo "##### 2. IsSavingAndFillingEnabled / IsFillingEnabled definitions"
          grep -rn -A20 "::IsSavingAndFillingEnabled(" chrome/browser/password_manager \
            --include=*.cc | head -120
          grep -rn -A20 "::IsFillingEnabled(" chrome/browser/password_manager \
            --include=*.cc | head -120

          echo; echo "##### 3. Android PromptUserToSaveOrUpdatePassword"
          grep -rn -A30 "::PromptUserToSaveOrUpdatePassword(" chrome/browser/password_manager \
            --include=*.cc | head -120

          echo; echo "##### 4. Android login handler + http auth handler"
          ls chrome/browser/ui/android | grep -i -E "login|http_auth" || true
          cat chrome/browser/ui/android/login_handler_android.cc 2>/dev/null | head -150

          echo; echo "##### 5. who calls HttpAuthManager::OnDidFinishMainFrameNavigation"
          grep -rn "OnDidFinishMainFrameNavigation\|GetHttpAuthManager" chrome/browser \
            components/password_manager --include=*.cc --include=*.h | grep -v _unittest | head -40

          echo; echo "##### 6. password_form_manager: http auth save path"
          grep -n -B2 -A25 "ProvisionallySaveHttpAuthForm" \
            components/password_manager/core/browser/password_form_manager.cc | head -100
